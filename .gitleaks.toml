# gitleaks 配置：默认规则 + 已核实的误报白名单 + DeepSeek 钥匙规则 + 大陆手机号规则。
# 新增白名单条目必须在 PR 里说明核实过程，由总调度评审。
# 为什么加 deepseek-api-key：gitleaks 8.30.1 的默认规则不抓「sk- 加 32 位小写十六进制」
# 这种形状的 DeepSeek 钥匙（实测默认规则扫描 no leaks found），提交钩子和合并前扫描
# 都用这份配置，所以此前拦不住 DeepSeek 钥匙。补一条专门规则。
[extend]
useDefault = true

[[allowlists]]
description = "已核实误报：文档里的占位符 base64('sk-test-key')"
regexes = ['''c2stdGVzdC1rZXk=''']

[[rules]]
id = "deepseek-api-key"
description = "DeepSeek API key：sk- 加 32 位小写十六进制"
regex = '''\bsk-[0-9a-f]{32}\b'''
keywords = ["sk-"]

# 为什么加 cn-mobile-number：测试和注释里出现过从真实文件抄来的手机号，默认规则不管手机号。
# 抓大陆手机号：1 开头、第二位 3-9，共 11 位，按 3-4-4 分组，组间可以有一个空格或短横线，
# 前面可以带 86 / +86。前后紧挨着字母、数字（或前面是小数点）的不算，免得把哈希、长数字误报。
# 测试里要用电话就用「100 0000 0000」这种不存在的号段；非要手机号的样子，只能用下面白名单里的假号。
[[rules]]
id = "cn-mobile-number"
description = "大陆手机号（3-4-4 分组，可带空格或短横线）"
regex = '''(?m)(?:^|[^0-9A-Za-z.])((?:\+?86[ -]?)?1[3-9][0-9][ -]?[0-9]{4}[ -]?[0-9]{4})(?:[^0-9A-Za-z]|$)'''
secretGroup = 1

[[rules.allowlists]]
description = "一看就是假的手机号：后八位全是 0，或者是 1234 5678"
regexes = [
    '''[0-9]{3}[ -]?0000[ -]?0000$''',
    '''[0-9]{3}[ -]?1234[ -]?5678$''',
]
