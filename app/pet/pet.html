<!doctype html>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title data-t="island.title"></title>
<style>
  :root {
    --ink: #1f1d1a;
    --eye: #f5f1e8;
    --accent: #c53a22;
    --text: #efe9df;
    --muted: #8f8a81;
    --curve-out: cubic-bezier(0.2, 0.8, 0.2, 1);
    --curve-in: cubic-bezier(0.4, 0, 0.2, 1);
    --curve-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
    --font-size: 13px;
    --font-stack: "Noto Sans SC", "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    --island-w: 112px;
    --island-h: 30px;
    --line-h: 4px;   /* 收成细线时那根线的高（跟小岛大小那档一起走） */
    --eye-zone: 56px;   /* 表情区宽：收着时是整条，冒一行时是左边这一段 */
    --zone-gap: 8px;    /* 两区之间的空 */
    --pad-right: 16px; /* 右边留 16 */
    --text-pad: 8px;   /* 文字区里左右各留 8，字在中间 */
    --dot-right: 13px; /* 红点：1:1 时中心 x=96 */
    --dot-top: 5.7px;
    --dot-size: 6px;
    --eye-shift: 28;   /* 展开时眼睛往左挪多少 px：pet.js 按这一档小岛算（整条宽的一半 − 表情区宽的一半） */
    --eye-u: 1;        /* SVG 单位换成 px：这一档小岛的比例（1:1 是 1） */
    --expand-ms: 240ms;  /* 跟壳里张开窗口同一个时长（theme.expandMs） */
    --collapse-ms: 200ms; /* 跟壳里收起窗口同一个时长（theme.collapseMs） */
  }
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body {
    position: relative;
    font-family: var(--font-stack);
    color: var(--text);
    opacity: 1;
  }
  body.still * { transition: none !important; animation: none !important; }
  /* 关了「显示动画」：不扫、不眨、不抬头，直接是往下看的静止帧 */
  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0s !important; animation: none !important; }
  }

  /* 整岛动（引擎写在这一层，别写在 #strip 上——会把 .press 盖掉）。
     位移和缩放都乘这一档小岛的比例（--eye-u） */
  #bob { position: absolute; left: 0; top: 0; right: 0; height: var(--island-h); transform-origin: center; will-change: transform; }
  /* 小条：底色只画主题那么高（1:1 是 30）。
     Windows 给透明无边框的窗垫了最小高（要 30 实得 36，100% 缩放时垫到 71），
     底色要是铺满整个窗，眼睛和字就都偏上：排版是按主题的 30 算的，落在更高的窗里。
     窗外多出来的那一截是透明的，看得见的小条还是 30。 */
  #strip {
    position: absolute; left: 0; top: 0; right: 0;
    height: var(--island-h);
    background: var(--ink);
    border-radius: 10px;
    overflow: hidden;
  }
  /* 被点那一下：缩到 0.96 再弹回（80ms 缩 + 120ms 回） */
  #strip.press { transform: scale(var(--press-scale, .96)); transition: transform 80ms var(--curve-out); }
  #strip.press-back { transform: scale(1); transition: transform 120ms var(--curve-out); }
  /* 收成细线的时候：整条就是那根线。
     墨色只画那根线那么高，下面透明——不然窗被 Windows 垫高的那一截也是墨的，
     全屏放 PPT 时顶上就挂着一块黑。 */
  body[data-scene="line"] #strip { height: var(--line-h); border-radius: 2px; }

  /* 眼睛：1:1 时两只眼睛中心在 x=46、x=66、y=15。
     每只眼睛一个 <g>（pet.js 每帧写 translate + scale），里面一个椭圆（上下眼皮用 clip-path）
     和一条笑眼细线；两只眼睛外面包一个 <g>，用 frame.eyesRot 绕岛中心 (56,15) 转。
     大小随外层盒子缩放（viewBox 112×30），别的动法全在引擎里。 */
  #eyes {
    position: absolute; left: 0; top: 0;
    width: var(--island-w); height: var(--island-h);
    pointer-events: none;
  }
  #eye-shift { position: absolute; inset: 0; will-change: transform; }
  #eye-shift > svg { display: block; width: 100%; height: 100%; overflow: visible; }
  /* 椭圆：填色；眼皮是 clip-path（闭多少由 pet.js 每帧给） */
  .pupil { fill: var(--eye); }
  /* 笑眼细线：不填色、描边 1.4、圆头（smile ≥ 0.42 时只显示它） */
  .lid { fill: none; stroke: var(--eye); stroke-width: 1.4; stroke-linecap: round; }
  /* 拖着走的 > < 是折线：2.2 宽、圆头圆角、不填充（frame.shape 为 'drag' 时只显示它们） */
  .sh-drag { fill: none; stroke: var(--eye); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  /* 展开时眼睛从整条正中滑到左边表情区的正中，跟壳里改窗口大小同一个时长、同一条曲线：
     张开 240ms 出来曲线，收起 200ms 收回曲线 */
  #eye-shift { transition: transform var(--collapse-ms) var(--curve-in); }
  body[data-scene="expanded"] #eye-shift,
  body[data-scene="tray"] #eye-shift { transform: translateX(calc(var(--eye-shift) * -1px)); transition: transform var(--expand-ms) var(--curve-out); }
  /* 睡着的呼吸不再用 CSS 动画：透明、置顶的小窗上一直不停的动画让 GPU 进程每帧都在合成，
     睡着要烧一个核的 16–21%（docs/0.4/小岛-CPU-实测.md）。
     pet.js 的 breath.mjs 低频（一秒 4 次）写 #eyes 的 transform，起伏 0.22 × var(--eye-u)；
     data-breathing 还挂在 body 上，留给调试和测试用。 */
  body[data-scene="line"] #eyes { display: none; }

  /* 冒的那一行：左边是表情区，右边是文字区，宽度跟着字走 */
  #bubble {
    position: absolute;
    left: calc(var(--eye-zone) + var(--zone-gap));
    right: var(--pad-right);
    top: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; overflow: hidden;
    transition: opacity 100ms linear;
  }
  #bubble-inner {
    display: inline-flex; align-items: center; gap: 8px;
    white-space: nowrap; font-size: var(--font-size); line-height: 1;
    max-width: 100%; min-width: 0;
  }
  /* 字太长就收成省略号，不裁掉半个字 */
  #bubble-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #bubble-actions { flex: none; display: inline-flex; gap: 8px; }
  /* 窗口没撑开之前不露字：免得字被裁掉半个 */
  body[data-bubble="fit"] #bubble, body[data-bubble="tight"] #bubble { opacity: 1; transition: opacity 120ms linear 40ms; }
  #measure {
    position: absolute; left: -9999px; top: 0;
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
    font-size: var(--font-size); line-height: 1; visibility: hidden;
  }
  .action {
    font: inherit; color: var(--text); background: none; border: 0; padding: 0;
    cursor: pointer; text-decoration: underline; text-underline-offset: 2px;
  }

  /* 要你看一眼：红点 */
  #dot {
    position: absolute; top: var(--dot-top); right: var(--dot-right);
    width: var(--dot-size); height: var(--dot-size);
    border-radius: 50%; background: var(--accent);
    opacity: 0; transform: scale(0.3);
    transition: opacity 150ms linear, transform 250ms var(--curve-bounce);
  }
  body[data-mode="look"] #dot { opacity: 1; transform: scale(1); }
  /* 等确认：跟「要你看一眼」一样亮着红点 */
  body[data-mode="confirm"] #dot { opacity: 1; transform: scale(1); }
  /* 有新早报：右上角亮 6×6 的 #e0573c 红点（跟「要你看一眼」那个红不是同一种） */
  body[data-news="1"] #dot { background: #e0573c; opacity: 1; transform: scale(1); }

  /* 接文件：小岛自己往两边长开（跟冒一行一样的长法，高度不变，不往下挡任务窗），
     眼睛挪到左边睁大，右边写「松手交给我」；文件压在小岛上时描一圈米白的边 */
  #droptext {
    position: absolute;
    left: calc(var(--eye-zone) + var(--zone-gap));
    right: var(--pad-right);
    top: 0; height: 100%;
    display: flex; align-items: center; justify-content: center;
    white-space: nowrap; font-size: var(--font-size); font-weight: 500; line-height: 1; color: var(--text);
    opacity: 0; pointer-events: none;
    transition: opacity 100ms linear;
  }
  body[data-scene="tray"] #droptext { opacity: 1; transition: opacity 120ms linear 120ms; }
  body[data-scene="tray"] #bubble { opacity: 0; }
  body[data-scene="tray"] #strip.hot { box-shadow: inset 0 0 0 1.5px var(--eye); }
</style>
<div id="bob">
<div id="strip">
  <div id="eyes" aria-hidden="true">
    <div id="eye-shift">
      <svg viewBox="0 0 112 30" width="100%" height="100%">
        <!-- 眼睛那一对绕岛中心 (56,15) 转（frame.eyesRot）；每只眼睛一个 g：translate(cx cy) scale(sx sy) -->
        <g id="eye-spin">
          <g id="eye-l" transform="translate(46 15)">
            <ellipse class="pupil" cx="0" cy="0" rx="5.3" ry="5.3"></ellipse>
            <path class="lid" opacity="0" d="M-5.1 1.05 Q 0 -1.75 5.1 1.05"></path>
          </g>
          <g id="eye-r" transform="translate(66 15)">
            <ellipse class="pupil" cx="0" cy="0" rx="5.3" ry="5.3"></ellipse>
            <path class="lid" opacity="0" d="M-5.1 1.05 Q 0 -1.75 5.1 1.05"></path>
          </g>
          <!-- 拖着走的 > <：两条折线，frame.shape 为 'drag' 时只显示它们 -->
          <path class="sh-drag" style="display:none" d="M42.5 11 L49.5 15 L42.5 19"></path>
          <path class="sh-drag" style="display:none" d="M69.5 11 L62.5 15 L69.5 19"></path>
        </g>
      </svg>
    </div>
  </div>
  <div id="bubble"><span id="bubble-inner"><span id="bubble-text"></span><span id="bubble-actions"></span></span></div>
  <div id="droptext" data-t="desk.dropHere"></div>
  <div id="dot"></div>
</div>
</div>
<span id="measure"></span>
<script type="module" src="pet.js"></script>
